version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=sqlite:///./data/shiba_vpn.db
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
    restart: unless-stopped

